app:
  jwt-secret: "${APP_JWT_SECRET:dev-only-secret-change-me-please}"
  internal-secret: "${APP_INTERNAL_SECRET:dev-only-internal-secret-change-me}"
  jwt-ttl: 86400000

spring:
  datasource:
    url: jdbc:h2:file:./data/audit;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
