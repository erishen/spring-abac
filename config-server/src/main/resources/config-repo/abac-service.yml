app:
  jwt-secret: "dev-only-secret-change-me-please"
  jwt-ttl: 86400000
  # PIP：资源属性缺失时的兜底策略。
  #   true  = fail-closed（查不到资源属性直接拒绝，安全默认）
  #   false = fail-open（按仅有的属性继续判定）
  pip-fail-closed: true

spring:
  datasource:
    url: jdbc:h2:file:./data/abac;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
