app:
  jwt-secret: "dev-only-secret-change-me-please"
  jwt-ttl: 86400000

spring:
  datasource:
    url: jdbc:h2:file:./data/auth;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false

# 日志行带上 MDC traceId（由 TraceIdFilter 写入），可用同一 traceId grep 串联整条调用链
logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
