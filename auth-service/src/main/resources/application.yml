server:
  port: 4111

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://localhost:8889

logging:
  level:
    org.springframework: WARN
    org.hibernate.SQL: OFF

# Eureka 配置必须是顶层 eureka.*，写在 spring.* 下不生效（Spring Cloud 不读 spring.eureka）
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8762/eureka
  # 用环回地址注册，保证网关经 lb 连 127.0.0.1 必定可达（避免主机名/LAN IP 不可达）。
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
