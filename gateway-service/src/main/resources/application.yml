server:
  port: 4110

spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8889
  cloud:
    gateway:
      routes:
        # 同路由下多个谓词是 AND，故「/api/login 或 /api/register」要用单 Path + 逗号（OR 语义）
        - id: auth-public
          uri: lb://auth-service
          predicates:
            - Path=/api/login,/api/register
        - id: auth-me
          uri: lb://auth-service
          predicates:
            - Path=/api/me
        - id: auth-users
          uri: lb://auth-service
          predicates:
            - Path=/api/users,/api/users/**
        - id: abac-policies
          uri: lb://abac-service
          predicates:
            - Path=/api/policies,/api/policies/**
        # 裁决/批量裁决接口：只做只读模拟，不落库，故仅需登录（不做策略门禁）
        - id: abac-decide
          uri: lb://abac-service
          predicates:
            - Path=/api/decide,/api/decide/**
        - id: document-api
          uri: lb://document-service
          predicates:
            - Path=/api/documents,/api/documents/**
        - id: audit-api
          uri: lb://audit-service
          predicates:
            # 仅放行 GET：审计写入由网关内部经服务发现直连（带私有头），外部无法伪造
            - Path=/api/audit,/api/audit/**
            - Method=GET
        # 交易风控：下单前置校验 + 复核任务 + 当日累计统计
        - id: risk-trades
          uri: lb://risk-service
          predicates:
            - Path=/api/trades,/api/trades/**
        # AI Agent 前置校验：工具调用门禁 + 复核任务 + 会话统计
        - id: agent-tools
          uri: lb://agent-service
          predicates:
            - Path=/api/agent,/api/agent/**

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers

logging:
  level:
    org.springframework: WARN
    reactor: WARN
    # 开发/演示环境：config-server 用 optional: import，启动瞬间 config-server 未就绪会打 WARN，
    # 属预期（本地兜底 yml 已接管），降到 ERROR 避免噪音；生产如需感知配置拉取失败可调回 WARN。
    org.springframework.cloud.config.client.ConfigServerConfigDataLoader: ERROR
    # Spring Cloud LoadBalancer 开发期建议用 Caffeine 缓存的提示，演示环境无需，关掉。
    "org.springframework.cloud.loadbalancer.config.LoadBalancerCacheAutoConfiguration$LoadBalancerCaffeineWarnLogger": OFF

# 本地兜底（config-server 不可用时生效）
resilience4j:
  circuitbreaker:
    instances:
      abac-decide:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallDurationThreshold: 800ms
        slowCallRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 5s
        automaticTransitionFromOpenToHalfOpenEnabled: true

# Eureka 配置必须是顶层 eureka.*，写在 spring.* 下不生效（Spring Cloud 不读 spring.eureka）
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8762/eureka
    registry-fetch-interval-seconds: 3
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

# 本地兜底：config-server 用 optional: import，偶发不可达时会静默跳过 import，
# 此时必须能解析 ${app.jwt-secret}，否则 AuthGlobalFilter 启动即退（Exit 1）。
# 运行时 config-server 提供的同名值优先级更高，会覆盖此处（行为不变）。
app:
  jwt-secret: "${APP_JWT_SECRET:dev-only-secret-change-me-please}"
  jwt-ttl: 86400000
  # 网关↔audit 内部共享密钥（审计写入防伪头）；生产用 APP_INTERNAL_SECRET 注入
  internal-secret: "${APP_INTERNAL_SECRET:dev-only-internal-secret-change-me}"
