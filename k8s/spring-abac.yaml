# spring-abac — k3s / Kubernetes 部署清单（namespace abac-demo）
#
# 与 spring-rbac（namespace rbac-demo，端口 8761/8888/41xx）完全隔离，可共存。
# 镜像不带 registry 前缀 + imagePullPolicy: IfNotPresent —— 用 make k3s-build 构建到
# 节点本地（OrbStack 下 k3s 直接可见 docker 本地镜像），无需推远端仓库。
#
# 部署顺序由 readiness 自然保证：config/eureka 先起，其余服务靠 Eureka 发现彼此。

apiVersion: v1
kind: Namespace
metadata:
  name: abac-demo

---
# ---------------- 基础设施 ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: abac-demo
  labels:
    app: eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server
          image: spring-abac/eureka-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8762
          env:
            - name: EUREKA_INSTANCE_HOSTNAME
              value: eureka-server
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: http://eureka-server:8762/eureka
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "512Mi", cpu: "500m" }

---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  namespace: abac-demo
spec:
  selector:
    app: eureka-server
  ports:
    - port: 8762
      targetPort: 8762
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: abac-demo
  labels:
    app: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: spring-abac/config-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8889
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "512Mi", cpu: "500m" }

---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: abac-demo
spec:
  selector:
    app: config-server
  ports:
    - port: 8889
      targetPort: 8889
  type: ClusterIP

---
# ---------------- 业务服务（模板相同的四个） ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: abac-demo
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: spring-abac/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4111
          env:
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: http://eureka-server:8762/eureka
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "false"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: auth-service
            - name: CONFIG_SERVER_HOST
              value: config-server
          resources:
            requests: { memory: "320Mi", cpu: "100m" }
            limits: { memory: "640Mi", cpu: "800m" }

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: abac-demo
spec:
  selector:
    app: auth-service
  ports:
    - port: 4111
      targetPort: 4111
  type: ClusterIP

