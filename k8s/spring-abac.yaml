---
# ---------------- 网关（唯一入口 / PEP） ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: abac-demo
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: spring-abac/gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4110
          env:
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              value: http://eureka-server:8762/eureka
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "false"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: gateway-service
            - name: CONFIG_SERVER_HOST
              value: config-server
          livenessProbe:
            httpGet: { path: /health, port: 4110 }
            initialDelaySeconds: 45
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 4110 }
            initialDelaySeconds: 40
            periodSeconds: 10
          resources:
            requests: { memory: "384Mi", cpu: "200m" }
            limits: { memory: "768Mi", cpu: "1000m" }

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: abac-demo
spec:
  selector:
    app: gateway-service
  ports:
    - port: 4110
      targetPort: 4110
  type: ClusterIP

---
# ---------------- 前端（容器内经服务名调网关） ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: abac-demo
  labels:
    app: web
spec:
  replicas: 1
  selector:
